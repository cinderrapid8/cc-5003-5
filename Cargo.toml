[workspace]
resolver = "2"
members = ["crates/align-core", "crates/align-cli"]
exclude = ["crates/align-tauri"]
# The Tauri GUI crate (crates/align-tauri) is excluded from the default build
# because it requires the system webkit2gtk/GTK toolchain. Build it with:
#   cd crates/align-tauri && cargo build
# on a host where `tauri dev` prerequisites are installed.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/band-align"

[workspace.dependencies]
align-core = { path = "crates/align-core" }
hound = "3.5"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: project files are an audit trail — anchor times and map
# joints must survive a save/load cycle bit-exactly (see map.rs project_t0).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
