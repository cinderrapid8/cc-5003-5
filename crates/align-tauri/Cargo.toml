[package]
name = "align-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "align_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
align-core = { path = "../align-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]
